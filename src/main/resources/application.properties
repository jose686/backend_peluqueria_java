# Application configuration
spring.application.name=backend

# SERVER CONFIGURATION
server.port=8080

# MYSQL DATABASE CONFIGURATION
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:peluqueria_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate MySQL Properties
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

# POSTGRESQL CONFIGURATION TEMPLATE (Uncomment to use instead of H2)
# spring.datasource.url=jdbc:postgresql://localhost:5432/peluqueriadb
# spring.datasource.driverClassName=org.postgresql.Driver
# spring.datasource.username=postgres
# spring.datasource.password=yourpassword
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# spring.jpa.hibernate.ddl-auto=update
# spring.jpa.show-sql=true

# JWT CONFIGURATION
# Need a 256-bit or 512-bit secret key in base64 or plaintext
app.jwt.secret=${JWT_SECRET:unaClaveSecretaMuyLargaYSeguraDePruebaParaDesarrolloYTests1234567890}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.media.storage-path=${MEDIA_STORAGE_PATH:uploads/media}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
