# Test profile: use the local MySQL instance so persisted data remains inspectable.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:peluqueria_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Preserve the local schema and existing data
spring.jpa.hibernate.ddl-auto=update

# JWT CONFIGURATION PARA TESTS
app.jwt.secret=${JWT_SECRET:unaClaveSecretaMuyLargaYSeguraDePruebaParaDesarrolloYTests1234567890}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# MEDIA STORAGE CONFIGURATION PARA TESTS
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.media.storage-path=${MEDIA_STORAGE_PATH:uploads/media}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}